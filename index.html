<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Temperatura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Conversor de Temperatura</h1>
    
    <div class="input-group">
      <label for="celsius">Grados Celsius (ºC):</label>
      <input type="number" id="celsius" placeholder="Ej. 100" step="any">
      <button id="to-fahrenheit-btn">Convertir a ºF</button>
    </div>

    <div class="input-group">
      <label for="fahrenheit">Grados Fahrenheit (ºF):</label>
      <input type="number" id="fahrenheit" placeholder="Ej. 212" step="any">
      <button id="to-celsius-btn">Convertir a ºC</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
